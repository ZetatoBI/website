name: Refresh Insights

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC = 6:30 PM New York (5:30 PM in winter), after the US close
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "insights/template.html"
      - "insights/content.json"
      - "pipeline/**"
      - ".github/workflows/insights.yml"

permissions:
  contents: write

concurrency:
  group: insights
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Build Insights
        run: python pipeline/build_insights.py
      - name: Save data and publish
        run: |
          git config user.name "zetato-bot"
          git config user.email "zetato-bot@users.noreply.github.com"
          git add insights/index.html insights/data sitemap.xml
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "Insights data for $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
      - name: Check template version
        run: |
          if [ -f .template-mismatch ]; then
            echo "::error::Template and pipeline versions don't match. Data was saved, but the page was not updated."
            exit 1
          fi
